name: Mimosa iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Mimosa iOS
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          python3 --version
          uname -m

      - name: Verify Mimosa network patch
        run: |
          grep -n -A25 -B5 \
            'MIMOSA_SERVER_IP' \
            submodules/TelegramCore/Sources/Network/Network.swift

      - name: MIMOSA DNS FIX
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf || true
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf || true
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000

      - name: Check submodules
        run: |
          git submodule status --recursive

      - name: Verify Bazel download
        run: |
          set -eux

          BAZEL_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["bazel"].split(":")[0])')"
          BAZEL_SHA="$(python3 -c 'import json; print(json.load(open("versions.json"))["bazel"].split(":")[1])')"

          echo "Bazel version: $BAZEL_VERSION"
          echo "Expected SHA256: $BAZEL_SHA"

          URL="https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-darwin-x86_64"

          echo "Downloading:"
          echo "$URL"

          curl -fL "$URL" -o /tmp/bazel-test

          echo "Actual SHA256:"
          shasum -a 256 /tmp/bazel-test

          ACTUAL_SHA="$(shasum -a 256 /tmp/bazel-test | awk '{print $1}')"

          if [ "$ACTUAL_SHA" != "$BAZEL_SHA" ]; then
            echo "ERROR: Bazel SHA256 mismatch"
            exit 1
          fi

          chmod +x /tmp/bazel-test
          /tmp/bazel-test --version

      - name: Generate Xcode project
        env:
          MIMOSA_SERVER_IP: ${{ secrets.MIMOSA_SERVER_IP }}
          MIMOSA_SERVER_PORT: ${{ secrets.MIMOSA_SERVER_PORT }}
        run: |
          rm -rf "$HOME/telegram-bazel-cache"
          rm -rf build-input/bazel-*
          export APS_ENVIRONMENT=""

          python3 build-system/Make/Make.py \
            generateProject \
            --disableProvisioningProfiles \
            --xcodeManagedCodesigning \
            --configurationPath=build-system/template_minimal_development_configuration.json

      - name: Build
        env:
          MIMOSA_SERVER_IP: ${{ secrets.MIMOSA_SERVER_IP }}
          MIMOSA_SERVER_PORT: ${{ secrets.MIMOSA_SERVER_PORT }}
        run: |
          python3 build-system/Make/Make.py \
            build \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --configuration=debug_arm64 \
            --buildNumber=10000 \
            --xcodeManagedCodesigning

      - name: Find build artifacts
        if: always()
        run: |
          echo "===== BUILD FILES ====="
          find build build-input -type f \
            \( -name "*.app" -o -name "*.ipa" \) \
            -print 2>/dev/null || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mimosa-iOS
          path: |
            build/**/*.app
            build/**/*.ipa
          if-no-files-found: warn
